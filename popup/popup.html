<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
  <title>Spoutube</title>
</head>
<body>
  <header class="brand">
    <span class="brand__logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="26" height="26"><path fill="#1ed760" d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.5 17.31a.75.75 0 0 1-1.03.25c-2.82-1.72-6.37-2.11-10.55-1.16a.75.75 0 1 1-.33-1.46c4.57-1.04 8.5-.59 11.66 1.34.35.22.46.68.25 1.03zm1.47-3.27a.94.94 0 0 1-1.29.31c-3.23-1.98-8.15-2.56-11.97-1.4a.94.94 0 1 1-.54-1.8c4.37-1.32 9.79-.67 13.5 1.6.44.27.58.85.3 1.29zm.13-3.4C15.83 8.26 8.9 8.02 5.12 9.17a1.12 1.12 0 1 1-.65-2.15C8.82 5.7 16.47 5.98 20.7 8.49a1.12 1.12 0 1 1-1.15 1.93z"/></svg>
    </span>
    <div class="brand__text">
      <h1>Spoutube</h1>
      <p>YouTube Music, dressed as Spotify</p>
    </div>
  </header>

  <div class="row">
    <div class="row__label">
      <span class="row__title">Enable reskin</span>
      <span class="row__sub" id="statusText">On</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle" checked />
      <span class="switch__track"><span class="switch__thumb"></span></span>
    </label>
  </div>

  <footer class="foot">
    <span id="hint">Reload music.youtube.com after toggling.</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
